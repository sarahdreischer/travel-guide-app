services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_pass
      POSTGRES_DB: travel_guide
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel_user -d travel_guide']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
