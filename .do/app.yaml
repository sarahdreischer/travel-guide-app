# DigitalOcean App Platform deployment spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Deploy via:
#   1. Push to GitHub
#   2. Connect repo in DO App Platform dashboard
#   3. It auto-detects this spec file
#
# Or deploy via CLI:
#   doctl apps create --spec .do/app.yaml

name: travel-guide

services:
  - name: web
    # Build from Dockerfile
    dockerfile_path: Dockerfile
    github:
      repo: sarahdreischer/travel-guide-app  # ← UPDATE THIS
      branch: main
      deploy_on_push: true
    # Instance size — basic-xxs ($5/mo) works for personal use
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    routes:
      - path: /
    # Health check
    health_check:
      http_path: /login
      initial_delay_seconds: 10
      period_seconds: 30
    # Environment variables — set these in the DO dashboard or here
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        # Set this to your Neon connection string:
        # postgresql://user:pass@ep-xxx.region.neon.tech/travel_guide?sslmode=require
        value: "${DATABASE_URL}"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${OPENAI_API_KEY}"
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: "${APP_URL}"
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.resend.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        value: resend
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
        value: "${RESEND_API_KEY}"
      - key: SMTP_FROM
        scope: RUN_TIME
        value: "Travel Guide <noreply@travelguide.com>"
      - key: AI_MAX_CALLS_PER_MINUTE
        scope: RUN_TIME
        value: "20"
      - key: AI_MAX_CALLS_PER_DAY
        scope: RUN_TIME
        value: "200"
      - key: AI_BATCH_TIMEOUT_MS
        scope: RUN_TIME
        value: "90000"
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
